<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121512"><title>playRecap · 私人听书</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">
<script src="/script.js" defer></script>
</head>
<body>
<header><a class="brand" href="/">◒ <span>playRecap</span></a><span class="badge">私人书库</span></header>
<main>
<section id="login" class="login panel" hidden>
<h1>私人书库</h1>
<form id="login-form"><label for="code">访问口令</label><input id="code" type="password" autocomplete="current-password" required><button class="primary" type="submit">进入书库 →</button></form>
<p id="login-status" role="status" class="muted"></p>
</section>
<div id="app" hidden>
<div class="heading"><h1>听书</h1><button id="add-btn" class="primary">＋ 导入音频</button></div>
<div class="layout">
<section class="panel player" aria-label="音频播放器">
<div class="cover" aria-hidden="true"><div class="moon"></div><div class="cover-lines"></div></div>
<p id="book-title" class="eyebrow"></p><h2 id="chapter-title">暂无音频</h2><p id="status" role="status" class="muted"></p>
<audio id="audio" preload="metadata" playsinline></audio>
<div class="timeline"><label class="sr-only" for="seek">播放进度</label><input type="range" id="seek" min="0" max="100" value="0" step="0.1" disabled><div><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div>
<div class="transport"><button id="prev" aria-label="上一章" disabled>Ⅰ◀</button><button id="back" aria-label="后退 15 秒" disabled>↶<small>15</small></button><button id="play" class="play" aria-label="播放" disabled>▶</button><button id="forward" aria-label="前进 15 秒" disabled>↷<small>15</small></button><button id="next" aria-label="下一章" disabled>▶Ⅰ</button></div>
<div class="options"><label>倍速<select id="speed" aria-label="倍速"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>睡眠定时<select id="timer" aria-label="睡眠定时"><option value="0">关闭</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option><option value="chapter">本章结束</option></select></label></div>
<p id="timer-status" class="fine" role="status"></p>
</section>
<div class="collections"><section class="panel"><div class="section-heading"><h2>我的书架</h2><button id="refresh" class="text-btn">刷新</button></div><div id="books"></div><div id="empty" class="empty"><h3>暂无音频</h3><button id="empty-add" class="text-btn">导入音频</button></div></section><section id="chapters-panel" class="panel" hidden><div class="section-heading"><h2>章节</h2><span id="chapter-count" class="fine"></span></div><ol id="chapters"></ol></section></div>
</div>
<footer><button id="logout" class="text-btn">锁定书库</button></footer>
</div>
<p id="notice" role="status" class="notice" hidden></p>
</main>
<dialog id="import-dialog"><form id="import-form"><div class="section-heading"><h2>导入音频</h2><button id="close-import" type="button" aria-label="关闭">✕</button></div><label for="book-name">书名</label><input id="book-name" maxlength="70" placeholder="例如：睡前故事" required><label for="files">章节音频</label><input id="files" type="file" accept="audio/*,.m4a,.mp4" multiple required><p id="file-list" class="fine">MP3 / M4A · 按文件名排序</p><progress id="upload-progress" max="100" value="0" hidden></progress><p id="upload-status" role="status" class="muted"></p><button id="upload-btn" type="submit" class="primary">导入书库</button></form></dialog>
</body></html>
